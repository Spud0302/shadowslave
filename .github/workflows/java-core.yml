name: Preview gates

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize
      - ready_for_review
      - reopened
    paths:
      - 'mod/**'
      - 'shadowslave/**'
      - 'testserver/**'
      - '.github/workflows/java-core.yml'
  push:
    branches:
      - main
    paths:
      - 'mod/**'
      - 'shadowslave/**'
      - 'testserver/**'
      - '.github/workflows/java-core.yml'

permissions:
  contents: read

jobs:
  java:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Preview gates trigger contract
        run: python3 -m unittest discover -s shadowslave/tools/tests -p 'test_preview_gates_workflow.py'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Compile, unit test and package
        run: ./mod/gradlew -p mod build --stacktrace

      - name: Boot physical NeoForge client
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mod/run-client-smoke

          log="$RUNNER_TEMP/shadowslave-client.log"
          setsid xvfb-run -a ./mod/gradlew -p mod runClientSmoke --no-daemon >"$log" 2>&1 &
          client_group=$!

          cleanup() {
            kill -TERM -- "-$client_group" >/dev/null 2>&1 || true
            sleep 2
            kill -KILL -- "-$client_group" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for _ in $(seq 1 180); do
            if grep -Fq 'Shadow Slave client is loading' "$log" \
              && grep -Fq 'minecraft:textures/atlas/gui.png-atlas' "$log"; then
              grep -F 'Shadow Slave client is loading' "$log"
              grep -F 'minecraft:textures/atlas/gui.png-atlas' "$log" | tail -1
              echo 'Physical client completed resource initialization with Shadow Slave client code loaded.'
              exit 0
            fi

            if ! kill -0 "$client_group" >/dev/null 2>&1; then
              cat "$log"
              echo 'Physical client exited before completing resource initialization.' >&2
              exit 1
            fi

            sleep 1
          done

          cat "$log"
          echo 'Physical client did not complete resource initialization within 180 seconds.' >&2
          exit 1

      - name: Boot dedicated NeoForge server
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mod/run-server-smoke
          printf 'eula=true\n' > mod/run-server-smoke/eula.txt
          printf 'online-mode=false\n' > mod/run-server-smoke/server.properties

          log="$RUNNER_TEMP/shadowslave-server.log"
          setsid ./mod/gradlew -p mod runServerSmoke --no-daemon >"$log" 2>&1 &
          server_group=$!

          cleanup() {
            kill -TERM -- "-$server_group" >/dev/null 2>&1 || true
            sleep 2
            kill -KILL -- "-$server_group" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for _ in $(seq 1 180); do
            if grep -Eq 'Done \([0-9.]+s\)! For help, type "help"' "$log"; then
              grep -F 'Shadow Slave Java core is loading' "$log"
              echo 'Dedicated server reached ready state with Shadow Slave loaded.'
              exit 0
            fi

            if ! kill -0 "$server_group" >/dev/null 2>&1; then
              cat "$log"
              echo 'Dedicated server exited before reaching ready state.' >&2
              exit 1
            fi

            sleep 1
          done

          cat "$log"
          echo 'Dedicated server did not reach ready state within 180 seconds.' >&2
          exit 1

      - name: Upload development JAR
        uses: actions/upload-artifact@v4
        with:
          name: shadow-slave-java-core
          path: mod/build/libs/*.jar
          if-no-files-found: error

  datapack:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install harness dependencies
        working-directory: testserver
        run: npm install --no-audit --no-fund

      - name: Build and validate frozen datapack
        run: python3 shadowslave/tools/build_release.py

      - name: Boot vanilla 1.21.1 and run deployed harnesses
        shell: bash
        run: |
          set -euo pipefail

          server_url=$(python3 - <<'PY'
          import json
          import urllib.request

          with urllib.request.urlopen('https://piston-meta.mojang.com/mc/game/version_manifest_v2.json') as response:
              manifest = json.load(response)
          version_url = next(item['url'] for item in manifest['versions'] if item['id'] == '1.21.1')
          with urllib.request.urlopen(version_url) as response:
              version = json.load(response)
          print(version['downloads']['server']['url'])
          PY
          )
          curl --fail --location "$server_url" --output testserver/server.jar

          mkdir -p testserver/world/datapacks
          cp shadowslave-v1.0.0.zip testserver/world/datapacks/ss-trace.zip
          printf 'eula=true\n' > testserver/eula.txt
          cat > testserver/server.properties <<'EOF'
          online-mode=false
          difficulty=easy
          enable-command-block=true
          spawn-protection=0
          max-players=10
          level-name=world
          server-port=25565
          EOF

          python3 - <<'PY'
          import hashlib
          import json
          import uuid

          def offline_uuid(name: str) -> str:
              digest = bytearray(hashlib.md5(f'OfflinePlayer:{name}'.encode()).digest())
              digest[6] = (digest[6] & 0x0F) | 0x30
              digest[8] = (digest[8] & 0x3F) | 0x80
              return str(uuid.UUID(bytes=bytes(digest)))

          names = ['tester', 'alice', 'bob']
          with open('testserver/ops.json', 'w', encoding='utf-8') as output:
              json.dump([
                  {
                      'uuid': offline_uuid(name),
                      'name': name,
                      'level': 4,
                      'bypassesPlayerLimit': False,
                  }
                  for name in names
              ], output)
          PY

          log="$RUNNER_TEMP/shadowslave-datapack-server.log"
          fifo="$RUNNER_TEMP/shadowslave-server-console"
          mkfifo "$fifo"
          exec 3<>"$fifo"

          (
            cd testserver
            java -Xms1G -Xmx2G -jar server.jar nogui <"$fifo" >"$log" 2>&1
          ) &
          server_pid=$!

          cleanup() {
            echo stop >&3 2>/dev/null || true
            sleep 2
            kill "$server_pid" >/dev/null 2>&1 || true
            cat "$log" | tail -200 || true
          }
          trap cleanup EXIT

          for _ in $(seq 1 180); do
            if grep -Eq 'Done \([0-9.]+s\)! For help, type "help"' "$log"; then
              break
            fi
            if ! kill -0 "$server_pid" >/dev/null 2>&1; then
              cat "$log"
              echo 'Vanilla test server exited before ready state.' >&2
              exit 1
            fi
            sleep 1
          done

          if ! grep -Eq 'Done \([0-9.]+s\)! For help, type "help"' "$log"; then
            cat "$log"
            echo 'Vanilla test server did not reach ready state.' >&2
            exit 1
          fi

          cd testserver
          npm run deploy
          npm test

      - name: Upload datapack server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: datapack-server-log
          path: ${{ runner.temp }}/shadowslave-datapack-server.log
          if-no-files-found: ignore
