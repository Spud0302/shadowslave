name: Java core

on:
  pull_request:
    paths:
      - 'mod/**'
      - '.github/workflows/java-core.yml'
  push:
    branches:
      - main
    paths:
      - 'mod/**'
      - '.github/workflows/java-core.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up bootstrap Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Generate Gradle wrapper
        run: |
          gradle -p mod wrapper --gradle-version 9.2.1
          chmod +x mod/gradlew

      - name: Compile, unit test and package through wrapper
        run: ./mod/gradlew -p mod build --stacktrace

      - name: Upload generated Gradle wrapper
        uses: actions/upload-artifact@v4
        with:
          name: shadow-slave-gradle-wrapper
          path: |
            mod/gradlew
            mod/gradlew.bat
            mod/gradle/wrapper/gradle-wrapper.jar
            mod/gradle/wrapper/gradle-wrapper.properties
          if-no-files-found: error

      - name: Upload development JAR
        uses: actions/upload-artifact@v4
        with:
          name: shadow-slave-java-core
          path: mod/build/libs/*.jar
          if-no-files-found: error
