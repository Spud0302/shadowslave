name: Preview gates

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize
      - ready_for_review
      - reopened
    paths:
      - 'mod/**'
      - '.github/workflows/java-core.yml'
  push:
    branches:
      - main
    paths:
      - 'mod/**'
      - '.github/workflows/java-core.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  java:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Preview gates trigger contract
        run: python3 -m unittest discover -s shadowslave/tools/tests -p 'test_preview_gates_workflow.py'

      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Compile, unit test and package
        run: ./mod/gradlew -p mod build --stacktrace

      - name: Run game tests
        run: ./mod/gradlew -p mod runGameTestServer --stacktrace

      - name: Boot physical NeoForge client
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mod/run-client-smoke

          log="$RUNNER_TEMP/shadowslave-client.log"
          setsid xvfb-run -a ./mod/gradlew -p mod runClientSmoke --no-daemon >"$log" 2>&1 &
          client_group=$!

          cleanup() {
            kill -TERM -- "-$client_group" >/dev/null 2>&1 || true
            sleep 2
            kill -KILL -- "-$client_group" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for _ in $(seq 1 180); do
            if grep -Fq 'Shadow Slave client is loading' "$log" \
              && grep -Fq 'minecraft:textures/atlas/gui.png-atlas' "$log"; then
              grep -F 'Shadow Slave client is loading' "$log"
              grep -F 'minecraft:textures/atlas/gui.png-atlas' "$log" | tail -1
              echo 'Physical client completed resource initialization with Shadow Slave client code loaded.'
              exit 0
            fi

            if ! kill -0 "$client_group" >/dev/null 2>&1; then
              cat "$log"
              echo 'Physical client exited before completing resource initialization.' >&2
              exit 1
            fi

            sleep 1
          done

          cat "$log"
          echo 'Physical client did not complete resource initialization within 180 seconds.' >&2
          exit 1

      - name: Restart dedicated NeoForge server on same world
        shell: bash
        env:
          TIMEOUT_SECONDS: '180'
        run: ./mod/verify-smoke.sh server-restart

      - name: Upload development JAR
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shadow-slave-java-core
          path: mod/build/libs/*.jar
          if-no-files-found: error

