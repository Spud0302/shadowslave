name: Combat Core MVP

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize
      - ready_for_review
      - reopened
    paths:
      - 'combat-core/**'
      - '.github/workflows/combat-core.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build standalone combat-core project
        run: ./mod/gradlew -p combat-core clean test build --stacktrace

      - name: Upload development JAR
        uses: actions/upload-artifact@v4
        with:
          name: combat-core-dev
          path: combat-core/build/libs/*.jar
          if-no-files-found: error
