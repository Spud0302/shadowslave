name: One-shot admin documentation refresh

on:
  push:
    branches:
      - gpt/admin-docs-current-state
    paths:
      - .github/workflows/admin-doc-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out documentation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Reconcile current administrative Markdown
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          BASELINE = "e0850193d52c85b4f81e1115f908f9dbdb67d419"
          DATE = "2026-07-30"

          def write(path: str, content: str) -> None:
              p = Path(path)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(content.rstrip() + "\n", encoding="utf-8")

          def insert_after(path: str, needle: str, block: str, marker: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if marker in text:
                  return
              pos = text.index(needle) + len(needle)
              text = text[:pos] + "\n\n" + block.rstrip() + text[pos:]
              p.write_text(text, encoding="utf-8")

          def replace_between(path: str, start: str, end: str, replacement: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              left = text.index(start)
              right = text.index(end, left)
              text = text[:left] + replacement.rstrip() + "\n\n" + text[right:]
              p.write_text(text, encoding="utf-8")

          write("PROJECT-STATUS.md", f"""
