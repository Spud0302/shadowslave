plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.143'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroup('software.bernie.geckolib')
        }
    }
    maven {
        name = 'SmartBrainLib'
        url = 'https://dl.cloudsmith.io/public/tslat/sbl/maven/'
        content {
            includeGroup('net.tslat.smartbrainlib')
        }
    }
    maven {
        name = 'PlayerAnimationLibrary'
        url = 'https://repo.redlance.org/public'
        content {
            // PAL itself plus its mochafloats dependency.
            includeGroupByRegex('com\\.zigythebird.*')
        }
    }
}

neoForge {
    version = project.neo_version
    addModdingDependenciesTo sourceSets.test

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        clientSmoke {
            client()
            gameDirectory = project.file('run-client-smoke')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        serverSmoke {
            server()
            gameDirectory = project.file('run-server-smoke')
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id,
                    '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    implementation 'dev.spud.combatcore:combat-core:0.0.1-wip'
    implementation "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
    implementation "net.tslat.smartbrainlib:SmartBrainLib-neoforge-${minecraft_version}:${smartbrainlib_version}"
    // PAL's core module requests newer netty, fastutil, gson and slf4j than
    // Minecraft's strict pins, which Gradle cannot reconcile. Minecraft and
    // NeoForge already supply all four at runtime, so drop those transitive
    // requests and keep PAL's own (mochafloats, javassist).
    implementation("com.zigythebird.playeranim:PlayerAnimationLibNeo:${pal_version}") {
        exclude group: 'io.netty'
        exclude group: 'it.unimi.dsi'
        exclude group: 'com.google.code.gson'
        exclude group: 'org.slf4j'
    }
    // The Neo module declares Core at runtime scope only, so its animation types
    // (IAnimation, ModifierLayer, Animation) are absent at compile time. PAL ships
    // as a required mod, which supplies it at runtime; this is for compiling.
    compileOnly("com.zigythebird.playeranim:PlayerAnimationLibCore:${pal_version}") {
        exclude group: 'io.netty'
        exclude group: 'it.unimi.dsi'
        exclude group: 'com.google.code.gson'
        exclude group: 'org.slf4j'
    }

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            geckolib_version       : geckolib_version,
            smartbrainlib_version  : smartbrainlib_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
