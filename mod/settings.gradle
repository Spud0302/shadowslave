pluginManagement {
    repositories {
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'shadowslave-mod'

// Keep Combat Core as an independent Gradle build/JAR while allowing this
// consumer build to compile and run against its published project coordinates.
includeBuild('../combat-core')
